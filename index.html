  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2716/2716652.png">
  
  <!-- Bootstrap 5 & Icons -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    .badge-outbound { background-color: #0d6efd; }

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-custom px-3 py-2 shadow-sm">
  <div class="container-fluid">
    <span class="navbar-brand text-white fw-bold d-flex align-items-center gap-2">
      <i class="bi bi-shield-lock-fill fs-4"></i>
      <span class="d-none d-sm-inline">台塑企業總管理處安衛環中心｜環境監測處防火牆管理</span>
      <span class="d-inline d-sm-none">安衛環防火牆管理</span>
    </span>
    <div class="d-flex align-items-center gap-2">
      <span id="envBadge" class="badge bg-secondary">連線中...</span>

<!-- Main Container -->
<div class="container-fluid py-3">

    <div class="col-6 col-md-3">

        <option value="ALL">全部連線方向</option>
        <option value="Inbound (連入)">僅顯示：Inbound (連入)</option>
        <option value="Outbound (連出)">僅顯示：Outbound (連出)</option>
        <option value="Unmatched (未對應/待確認)">僅顯示：待確認異常</option>
      </select>

    <div class="col-12 col-md-4 d-flex justify-content-end gap-2 overflow-auto pb-2 pb-md-0">

      <div class="card px-2 py-1 border-0 shadow-sm bg-white text-center"><small class="text-muted">連入</small><span class="fw-bold text-success" id="statInbound">0</span></div>

          <div>
            <span class="fw-bold text-dark fs-6" id="currentHostTitle">全部主機總覽</span>
            <span class="badge bg-secondary ms-2" id="filteredCountBadge">0 筆</span>

        </div>
        <div class="table-responsive">
          <table class="table table-hover table-bordered align-middle mb-0" id="rulesTable">
            <thead>

              <select class="form-select" id="formDirection">

                <option value="Outbound (連出)">Outbound (連出)</option>
                <option value="Unmatched (未對應/待確認)">Unmatched (待確認)</option>

            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">主機名稱</label>
              <input type="text" class="form-control" id="formHostName" list="hostNameDatalist">
              <datalist id="hostNameDatalist"></datalist>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">主機 IP</label>
              <input type="text" class="form-control" id="formHostIp">

            <div class="col-md-6">
              <label class="form-label fw-bold">來源端 (Source IP)</label>

            <div class="col-md-6">
              <label class="form-label fw-bold">目的端 (Destination IP)</label>
              <input type="text" class="form-control" id="formDestination">

            <div class="col-md-6">

              <input type="text" class="form-control" id="formPort">

              <textarea class="form-control border-primary" id="formNote" rows="2"></textarea>
            </div>

      <div class="modal-footer">

<!-- Auth Modal (AES PIN Vault Version) -->
<div class="modal fade" id="authModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">🔐 輸入專屬短密碼解鎖系統</h5>
      </div>
      <div class="modal-body">
        <div class="alert alert-info small mb-3">
          <i class="bi bi-shield-check"></i> 本系統已內嵌 AES-256 加密金鑰保險箱。請輸入您自訂的<strong>解鎖短密碼</strong>，系統將自動於記憶體內解密並連線私有資料庫（同一設備解鎖一次後即自動記憶）。
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold text-primary fs-6">請輸入自訂解鎖短密碼 (PIN)：</label>
          <input type="password" id="authPinInput" class="form-control form-control-lg border-primary text-center fw-bold" placeholder="輸入短密碼後按 Enter..." onkeydown="if(event.key==='Enter') unlockWithPin()">
        </div>
        <div class="mt-3">
          <a class="small text-secondary text-decoration-none" data-bs-toggle="collapse" href="#manualTokenCollapse" role="button">
            <i class="bi bi-gear"></i> 進階：改為手動輸入 GitHub Token
          </a>
          <div class="collapse mt-2" id="manualTokenCollapse">
            <div class="card card-body bg-light p-2">
              <div class="mb-2"><label class="form-label small fw-bold mb-1">GitHub 帳號 (Owner)</label><input type="text" id="authOwner" class="form-control form-control-sm"></div>
              <div class="mb-2"><label class="form-label small fw-bold mb-1">GitHub Token</label><input type="password" id="authPat" class="form-control form-control-sm"></div>
              <button class="btn btn-sm btn-outline-dark w-100" onclick="saveAuthAndInit()">使用手動 Token 連線</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer d-flex justify-content-between">
        <button class="btn btn-outline-secondary btn-sm" onclick="clearAuth()">清除本機記憶</button>
        <button class="btn btn-primary fw-bold px-4" onclick="unlockWithPin()"><i class="bi bi-unlock-fill"></i> 立即解鎖載入</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const REPO_DB = 'fpg-firewall-db';
  // 部署精靈將於自動部署時把 AES-256-GCM 加密後的金鑰保險箱寫入此處
  const ENCRYPTED_VAULT = "eyJzIjoiaFl2UGJUUzlRNG5UWGIzSkdmZ1E4UT09IiwiaXYiOiJTTVI4MWJHV2ZhYks4YmhlIiwiY3QiOiJiNDJ0Y003b21aN0krSVQzd1dVQ0R1djlCN2NBeFNFVVBuWXpJL0pSVmwzc2pHc0dSYmY3b2E5NjlQcDBXNG8xVVduNjh2a2NOUW80VGJ5OHRWTVhjR0xkamVMUmNXOFhXb0VvbUNBSTAwcEVhT21KNlBzPSJ9";

  let ghOwner = localStorage.getItem('FPG_GH_OWNER') || '';
  let ghPat = localStorage.getItem('FPG_GH_PAT') || '';
  let dbSha = '';
  let authModal;

  let appState = { servers: [], rules: [], selectedHost: 'ALL', parsedUploadQueue: [] };

  window.onload = function() {
    authModal = new bootstrap.Modal(document.getElementById('authModal'));
    if (!ghOwner || !ghPat) {
      authModal.show();
      setTimeout(() => { const el = document.getElementById('authPinInput'); if(el) el.focus(); }, 400);
    } else {
      initApp();
    }
  };

  function showAuthModal() {
    document.getElementById('authPinInput').value = '';
    document.getElementById('authOwner').value = ghOwner;
    document.getElementById('authPat').value = ghPat;
    authModal.show();
    setTimeout(() => { const el = document.getElementById('authPinInput'); if(el) el.focus(); }, 400);
  }

  // Web Crypto API: 使用短密碼 (PIN) 解密內嵌的 AES-GCM 保險箱
  async function unlockWithPin() {
    const pin = document.getElementById('authPinInput').value.trim();
    if (!pin) return alert('請輸入解鎖短密碼');
    if (!ENCRYPTED_VAULT || ENCRYPTED_VAULT.includes('PLACEHOLDER')) {
      return alert('此頁面尚未寫入加密保險箱，請使用下方進階手動輸入 Token，或透過 v3 部署精靈重新部署。');
    }
    try {
      const vault = JSON.parse(atob(ENCRYPTED_VAULT));
      const enc = new TextEncoder();
      const dec = new TextDecoder();
      const salt = Uint8Array.from(atob(vault.s), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(vault.iv), c => c.charCodeAt(0));
      const ct = Uint8Array.from(atob(vault.ct), c => c.charCodeAt(0));

      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), {name: 'PBKDF2'}, false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        {name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256'},
        keyMaterial,
        {name: 'AES-GCM', length: 256},
        false,
        ['decrypt']
      );
      const decryptedBuf = await crypto.subtle.decrypt({name: 'AES-GCM', iv: iv}, key, ct);
      const payload = JSON.parse(dec.decode(decryptedBuf));
      ghOwner = payload.owner;
      ghPat = payload.pat;
      localStorage.setItem('FPG_GH_OWNER', ghOwner);
      localStorage.setItem('FPG_GH_PAT', ghPat);
      authModal.hide();
      initApp();
    } catch (e) {
      alert('❌ 解鎖短密碼錯誤，無法解密金鑰保險箱！請重新確認短密碼。');
      document.getElementById('authPinInput').select();
    }
  }

  function saveAuthAndInit() {
    ghOwner = document.getElementById('authOwner').value.trim();
    ghPat = document.getElementById('authPat').value.trim();
    if(!ghOwner || !ghPat) return alert('請填寫完整資訊');
    localStorage.setItem('FPG_GH_OWNER', ghOwner);
    localStorage.setItem('FPG_GH_PAT', ghPat);
    authModal.hide();
    initApp();
  }
  function clearAuth() { localStorage.clear(); location.reload(); }

  // Base64 UTF-8 Encoding/Decoding
  function b64EncodeUnicode(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1)));
  }
  function b64DecodeUnicode(str) {
    return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  }

  async function initApp() {
    const badge = document.getElementById('envBadge');
    badge.className = 'badge bg-warning text-dark';
    badge.innerText = '拉取資料中...';
    try {
      const res = await fetch(`https://api.github.com/repos/${ghOwner}/${REPO_DB}/contents/firewall_db.json?t=${Date.now()}`, {
        cache: 'no-store',
        headers: {
          'Authorization': `Bearer ${ghPat}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      dbSha = data.sha;
      const cleanB64 = (data.content || '').replace(/\s/g, '');
      const parsed = JSON.parse(b64DecodeUnicode(cleanB64));
      localStorage.setItem('FPG_FW_DB_CACHE', JSON.stringify(parsed));
      appState.servers = parsed.servers || [];
      appState.rules = parsed.rules || [];
      
      badge.className = 'badge bg-success';
      badge.innerHTML = '<i class="bi bi-cloud-check-fill"></i> 已連線私有庫';
      
      populateLocationFilter();
      populateDatalist();
      renderAll();
    } catch(e) {
      badge.className = 'badge bg-danger';
      badge.innerText = '連線失敗';
      alert('無法取得私有庫資料：' + e.message + '。請確認 Token 是否有效且包含 repo 權限。');
      authModal.show();
    }
  }

  async function saveToGitHub() {
    try {
      const payloadStr = JSON.stringify({servers: appState.servers, rules: appState.rules}, null, 2);
      const encodedContent = b64EncodeUnicode(payloadStr);
      
      const badge = document.getElementById('envBadge');
      badge.className = 'badge bg-warning text-dark';
      badge.innerText = '同步儲存中...';
      
      const res = await fetch(`https://api.github.com/repos/${ghOwner}/${REPO_DB}/contents/firewall_db.json`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${ghPat}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Update rules via WebApp: ${new Date().toLocaleString('zh-TW')}`,
          content: encodedContent,
          sha: dbSha
        })
      });
      const data = await res.json();
      if(res.ok) {
        dbSha = data.content.sha;
        badge.className = 'badge bg-success';
        badge.innerHTML = '<i class="bi bi-cloud-check-fill"></i> 同步完成';
      } else { throw new Error(data.message); }
    } catch(e) {
      alert('同步失敗: ' + e.message);
      document.getElementById('envBadge').className = 'badge bg-danger';
      document.getElementById('envBadge').innerText = '儲存失敗';
    }
  }

  // --- UI Rendering Logic ---
  function populateLocationFilter() {
    const locSelect = document.getElementById('locationFilter');
    const locs = [...new Set(appState.servers.map(s => String(s['主機位置']).trim()).filter(Boolean))];
    let html = '<option value="ALL">全部位置</option>';
    locs.forEach(l => html += `<option value="${l}">📍 ${l}</option>`);
    html += '<option value="未對應">📍 未對應</option>';
    const currentVal = locSelect.value;
    locSelect.innerHTML = html;
    if([...locSelect.options].some(o => o.value === currentVal)) locSelect.value = currentVal;
  }

  function populateDatalist() {
    document.getElementById('hostNameDatalist').innerHTML = appState.servers.map(s => `<option value="${s['主機名稱']}">${s['IP清單']} - ${s['作業機能']}</option>`).join('');
  }

  function onLocationChange() { appState.selectedHost = 'ALL'; renderAll(); }
  function selectHost(hostName) { appState.selectedHost = hostName; renderAll(); }
  function clearSearch() {
    document.getElementById('globalSearchInput').value = '';
    document.getElementById('directionFilter').value = 'ALL';
    document.getElementById('locationFilter').value = 'ALL';
    appState.selectedHost = 'ALL';
    renderAll();
  }

  function getFilteredRules() {
    const kw = document.getElementById('globalSearchInput').value.trim().toLowerCase();
    const dir = document.getElementById('directionFilter').value;
    const loc = document.getElementById('locationFilter').value;
    const hostToLoc = {};
    appState.servers.forEach(s => hostToLoc[s['主機名稱']] = s['主機位置']);
    
    return appState.rules.filter(r => {
      if (appState.selectedHost !== 'ALL' && r['主機名稱'] !== appState.selectedHost) return false;
      if (dir !== 'ALL' && r['分類方向'] !== dir) return false;
      if (loc !== 'ALL') {
         const rLoc = hostToLoc[r['主機名稱']] || '未對應';
         if (rLoc !== loc) return false;
      }
      if (!kw) return true;
      const searchableText = [
        r['規則ID'], r['主機名稱'], r['主機IP'], r['對端IP或主機'],
        r['來源端(Source)'], r['目的端(Destination)'], r['開放連接埠(Port)'],
        r['用途與申請說明'], r['來源檔案名稱'], r['自訂備註']
      ].join(' ').toLowerCase();
      return searchableText.includes(kw);
    });
  }

  function renderAll() {
    const loc = document.getElementById('locationFilter').value;
    const hostToLoc = {};
    appState.servers.forEach(s => hostToLoc[s['主機名稱']] = s['主機位置']);

    const srvContainer = document.getElementById('serverListContainer');
    let srvHtml = `<div class="list-group-item server-item d-flex justify-content-between align-items-center ${appState.selectedHost === 'ALL' ? 'active' : ''}" onclick="selectHost('ALL')"><div><div class="fw-bold">全部總覽</div></div></div>`;

    let visibleServers = appState.servers;
    if (loc !== 'ALL' && loc !== '未對應') visibleServers = appState.servers.filter(s => s['主機位置'] === loc);
    else if (loc === '未對應') visibleServers = [];

    visibleServers.forEach(srv => {
      const hName = srv['主機名稱'];
      const inCnt = appState.rules.filter(r => r['主機名稱'] === hName && r['分類方向'].includes('Inbound')).length;
      const outCnt = appState.rules.filter(r => r['主機名稱'] === hName && r['分類方向'].includes('Outbound')).length;
      const isAct = appState.selectedHost === hName ? 'active' : '';
      srvHtml += `
        <div class="list-group-item server-item ${isAct}" onclick="selectHost('${hName}')">
          <div class="d-flex justify-content-between align-items-center"><span class="fw-bold text-dark">${hName}</span>
            <div><span class="badge badge-inbound">In:${inCnt}</span> <span class="badge badge-outbound">Out:${outCnt}</span></div>
          </div>
          <div class="small text-secondary mt-1">${srv['IP清單']}</div>
          <div class="small text-muted text-truncate" title="${srv['作業機能']}">${srv['作業機能']}</div>
        </div>`;
    });

    if (loc === 'ALL' || loc === '未對應') {
      const unCnt = appState.rules.filter(r => r['主機名稱'] === '未對應清冊主機').length;
      srvHtml += `<div class="list-group-item server-item ${appState.selectedHost === '未對應清冊主機' ? 'active' : ''}" onclick="selectHost('未對應清冊主機')"><div class="d-flex justify-content-between align-items-center"><span class="fw-bold text-danger">未對應主機</span><span class="badge badge-unmatched">${unCnt}</span></div></div>`;
    }
    srvContainer.innerHTML = srvHtml;

    const filteredRules = getFilteredRules();
    let visibleHostNames = new Set(filteredRules.map(r => r['主機名稱']).filter(h => h !== '未對應清冊主機'));
    document.getElementById('statServers').innerText = visibleHostNames.size;
    document.getElementById('statInbound').innerText = filteredRules.filter(r => r['分類方向'].includes('Inbound')).length;
    document.getElementById('statOutbound').innerText = filteredRules.filter(r => r['分類方向'].includes('Outbound')).length;
    document.getElementById('statUnmatched').innerText = filteredRules.filter(r => r['分類方向'].includes('Unmatched')).length;

    document.getElementById('currentHostTitle').innerText = appState.selectedHost === 'ALL' ? '全部主機規則總覽' : `專屬視角：${appState.selectedHost}`;
    document.getElementById('filteredCountBadge').innerText = `${filteredRules.length} 筆`;

    const tbody = document.getElementById('rulesTableBody');
    if (filteredRules.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-muted">無符合資料</td></tr>`;
      return;
    }

    tbody.innerHTML = filteredRules.map(r => {
      let badgeCls = 'badge-inbound';
      if (r['分類方向'].includes('Outbound')) badgeCls = 'badge-outbound';
      if (r['分類方向'].includes('Unmatched')) badgeCls = 'badge-unmatched';
      
      const peerLabel = r['分類方向'].includes('Inbound') 
        ? `<span class="text-success fw-bold">[來源]</span><br>${escapeHtml(r['對端IP或主機'])}`
        : (r['分類方向'].includes('Outbound') ? `<span class="text-primary fw-bold">[目的]</span><br>${escapeHtml(r['對端IP或主機'])}` : `<span class="text-danger fw-bold">[待確認]</span><br>${escapeHtml(r['對端IP或主機'])}`);

      const isHighRisk = String(r['對端IP或主機']).includes('*') || String(r['對端IP或主機']).toLowerCase().includes('any');
      return `
        <tr class="${isHighRisk ? 'high-risk-row' : ''}">
          <td class="fw-bold text-secondary">${escapeHtml(r['規則ID'])}</td>
          <td><span class="badge ${badgeCls}">${escapeHtml(r['分類方向'])}</span></td>
          <td><div class="fw-bold">${escapeHtml(r['主機名稱'])}</div><div class="small text-muted">${escapeHtml(r['主機IP'])}</div></td>
          <td class="pre-line">${peerLabel}</td>
          <td class="fw-bold text-dark pre-line">${escapeHtml(r['開放連接埠(Port)'])}</td>
          <td><span class="badge bg-secondary">${escapeHtml(r['狀態'])}</span></td>
          <td class="pre-line small">${escapeHtml(r['用途與申請說明'])}</td>
          <td class="pre-line small text-muted">${escapeHtml(r['來源檔案名稱'])}</td>
          <td class="note-cell pre-line small"><div class="fw-bold text-dark">${escapeHtml(r['自訂備註'] || '')}</div></td>
          <td class="text-nowrap">
            <button class="btn btn-sm btn-outline-primary mb-1 w-100" onclick="openEditModal('${r['規則ID']}')"><i class="bi bi-pencil-square"></i> 修改</button>
            <button class="btn btn-sm btn-outline-danger w-100" onclick="deleteRule('${r['規則ID']}')"><i class="bi bi-trash"></i> 刪除</button>
          </td>
        </tr>`;
    }).join('');
  }

  function escapeHtml(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  // CRUD
  const editModal = new bootstrap.Modal(document.getElementById('editRuleModal'));
  function openEditModal(ruleId) {
    if (!ruleId) {
      document.getElementById('editModalTitle').innerText = '新增規則';
      document.getElementById('ruleForm').reset();
      document.getElementById('formRuleId').value = '';
    } else {
      const r = appState.rules.find(x => x['規則ID'] === ruleId);
      if (!r) return;
      document.getElementById('editModalTitle').innerText = `編輯 (${r['規則ID']})`;
      document.getElementById('formRuleId').value = r['規則ID'];
      document.getElementById('formDirection').value = r['分類方向'];
      document.getElementById('formHostName').value = r['主機名稱'];
      document.getElementById('formHostIp').value = r['主機IP'];
      document.getElementById('formSource').value = r['來源端(Source)'];
      document.getElementById('formDestination').value = r['目的端(Destination)'];
      document.getElementById('formPort').value = r['開放連接埠(Port)'];
      document.getElementById('formStatus').value = r['狀態'];
      document.getElementById('formPurpose').value = r['用途與申請說明'];
      document.getElementById('formFileName').value = r['來源檔案名稱'];
      document.getElementById('formNote').value = r['自訂備註'] || '';
    }
    editModal.show();
  }

  async function submitRuleForm() {
    const ruleId = document.getElementById('formRuleId').value;
    const isNew = !ruleId;
    const dir = document.getElementById('formDirection').value;
    const src = document.getElementById('formSource').value.trim();
    const dst = document.getElementById('formDestination').value.trim();
    const peer = dir.includes('Inbound') ? src : (dir.includes('Outbound') ? dst : `${src} -> ${dst}`);

    const ruleObj = {
      '規則ID': ruleId, '分類方向': dir,
      '主機名稱': document.getElementById('formHostName').value.trim(),
      '主機IP': document.getElementById('formHostIp').value.trim(),
      '對端IP或主機': peer, '來源端(Source)': src, '目的端(Destination)': dst,
      '開放連接埠(Port)': document.getElementById('formPort').value.trim(),
      '狀態': document.getElementById('formStatus').value.trim(),
      '用途與申請說明': document.getElementById('formPurpose').value.trim(),
      '來源檔案名稱': document.getElementById('formFileName').value.trim() || '網頁人工維護',
      '自訂備註': document.getElementById('formNote').value.trim(),
      '最後異動時間': new Date().toLocaleString('zh-TW', { hour12: false })
    };

    if (isNew) {
      const maxNum = appState.rules.reduce((acc, cur) => { const n = parseInt(String(cur['規則ID']).replace('R-', ''), 10); return !isNaN(n) && n > acc ? n : acc; }, 0);
      ruleObj['規則ID'] = 'R-' + String(maxNum + 1).padStart(4, '0');
      appState.rules.unshift(ruleObj);
    } else {
      const idx = appState.rules.findIndex(x => x['規則ID'] === ruleId);
      if (idx > -1) appState.rules[idx] = ruleObj;
    }
    editModal.hide();
    renderAll();
    await saveToGitHub();
  }

  async function deleteRule(ruleId) {
    if (!confirm(`確定要刪除規則 ${ruleId} 嗎？此動作將直接同步至 GitHub 且無法復原。`)) return;
    appState.rules = appState.rules.filter(x => x['規則ID'] !== ruleId);
    renderAll();
    await saveToGitHub();
  }

  function exportCurrentViewToExcel() {
    const filtered = getFilteredRules();
    if (filtered.length === 0) return alert('無資料');
    const ws = XLSX.utils.json_to_sheet(filtered);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "查詢結果");
    XLSX.writeFile(wb, `防火牆查詢匯出_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  // Upload Logic
  const uploadModal = new bootstrap.Modal(document.getElementById('uploadExcelModal'));
  function openUploadModal() {
    document.getElementById('excelFileInput').value = '';
    document.getElementById('parsedPreviewContainer').classList.add('d-none');
    appState.parsedUploadQueue = [];
    uploadModal.show();
  }

  async function handleExcelFiles(files) {
    appState.parsedUploadQueue = [];
    const skipKeywords = ['範本', '範例', '空白', '流程'];
    for (let file of files) {
      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data, { type: 'array' });
      workbook.SheetNames.forEach(sheetName => {
        if (skipKeywords.some(kw => sheetName.includes(kw))) return;
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: '' });
        for (let i = 0; i < rows.length; i++) {
          const rowVals = rows[i].map(x => String(x).trim().toLowerCase());
          if (rowVals.some(x => x.includes('source ip') || x.includes('來源')) && rowVals.some(x => x.includes('destination ip') || x.includes('目的'))) {
            const srcCol = rowVals.findIndex(x => x.includes('source ip') || x.includes('來源'));
            const dstCol = rowVals.findIndex(x => x.includes('destination ip') || x.includes('目的'));
            const portCol = rowVals.findIndex(x => x.includes('service') || x.includes('port') || x.includes('服務') || x.includes('連接埠'));
            const actCol = rowVals.findIndex(x => x.includes('accept') || x.includes('deny') || x.includes('狀態') || x.includes('核准'));
            const noteCol = rowVals.findIndex(x => x.includes('備註') || x.includes('用途') || x.includes('說明'));
            
            let j = i + 1;
            while (j < rows.length) {
              const r = rows[j];
              const serial = String(r[0] || '').trim();
              const srcIp = srcCol > -1 ? String(r[srcCol] || '').trim() : '';
              const dstIp = dstCol > -1 ? String(r[dstCol] || '').trim() : '';
              if (!serial && !srcIp && !dstIp) break;
              if (serial.includes('範例') || serial.includes('範本') || (!srcIp && !dstIp)) { j++; continue; }
              appState.parsedUploadQueue.push({
                fileName: `${file.name}`, sheetName: sheetName,
                source: srcIp.replace('172.24.4.50/103.138.93.80', '172.24.4.50'),
                destination: dstIp.replace('172.24.4.50/103.138.93.80', '172.24.4.50'),
                port: portCol > -1 ? String(r[portCol] || '').trim() : '',
                status: actCol > -1 ? String(r[actCol] || 'Accept').trim() : 'Accept',
                purpose: noteCol > -1 ? String(r[noteCol] || '').trim() : '',
                note: `由 ${sheetName} 匯入`
              });
              j++;
            }
            i = j;
          }
        }
      });
    }
    document.getElementById('parsedPreviewContainer').classList.remove('d-none');
    document.getElementById('parsedSummaryText').innerText = `解析出 ${appState.parsedUploadQueue.length} 筆`;
    document.getElementById('parsedPreviewBody').innerHTML = appState.parsedUploadQueue.map(item => `<tr><td>${escapeHtml(item.fileName)}</td><td>${escapeHtml(item.source)}</td><td>${escapeHtml(item.destination)}</td><td>${escapeHtml(item.port)}</td><td>${escapeHtml(item.purpose)}</td></tr>`).join('');
  }

  async function confirmBatchImport() {
    if (appState.parsedUploadQueue.length === 0) return;
    const ipToServer = {};
    const nameToServer = {};
    appState.servers.forEach(s => {
      const sName = s['主機名稱'];
      const ips = String(s['IP清單']).split('、').map(x => x.trim()).filter(Boolean);
      nameToServer[sName] = { name: sName, ips: ips };
      ips.forEach(ip => ipToServer[ip] = { name: sName, ip: ip });
    });

    let maxNum = appState.rules.reduce((acc, cur) => { const n = parseInt(String(cur['規則ID']).replace('R-', ''), 10); return !isNaN(n) && n > acc ? n : acc; }, 0);
    const nowStr = new Date().toLocaleString('zh-TW', { hour12: false });

    appState.parsedUploadQueue.forEach(item => {
      const srcClean = item.source.split('(')[0].trim();
      const dstClean = item.destination.split('(')[0].trim();
      let matched = false;
      if (ipToServer[dstClean] || nameToServer[dstClean]) {
        const srv = ipToServer[dstClean] || { name: nameToServer[dstClean].name, ip: nameToServer[dstClean].ips[0] || dstClean };
        maxNum++;
        appState.rules.unshift({
          '規則ID': 'R-' + String(maxNum).padStart(4, '0'), '分類方向': 'Inbound (連入)',
          '主機名稱': srv.name, '主機IP': srv.ip, '對端IP或主機': item.source, '來源端(Source)': item.source, '目的端(Destination)': srv.ip,
          '開放連接埠(Port)': item.port, '狀態': item.status, '用途與申請說明': item.purpose, '來源檔案名稱': item.fileName, '自訂備註': item.note, '最後異動時間': nowStr
        });
        matched = true;
      }
      if (ipToServer[srcClean] || nameToServer[srcClean]) {
        const srv = ipToServer[srcClean] || { name: nameToServer[srcClean].name, ip: nameToServer[srcClean].ips[0] || srcClean };
        maxNum++;
        appState.rules.unshift({
          '規則ID': 'R-' + String(maxNum).padStart(4, '0'), '分類方向': 'Outbound (連出)',
          '主機名稱': srv.name, '主機IP': srv.ip, '對端IP或主機': item.destination, '來源端(Source)': srv.ip, '目的端(Destination)': item.destination,
          '開放連接埠(Port)': item.port, '狀態': item.status, '用途與申請說明': item.purpose, '來源檔案名稱': item.fileName, '自訂備註': item.note, '最後異動時間': nowStr
        });
        matched = true;
      }
      if (!matched) {
        maxNum++;
        appState.rules.unshift({
          '規則ID': 'R-' + String(maxNum).padStart(4, '0'), '分類方向': 'Unmatched (未對應/待確認)',
          '主機名稱': '未對應清冊主機', '主機IP': '-', '對端IP或主機': `${item.source} -> ${item.destination}`,
          '來源端(Source)': item.source, '目的端(Destination)': item.destination,
          '開放連接埠(Port)': item.port, '狀態': item.status, '用途與申請說明': item.purpose, '來源檔案名稱': item.fileName, '自訂備註': item.note, '最後異動時間': nowStr
        });
      }
    });
    uploadModal.hide();
    renderAll();
    await saveToGitHub();
    alert(`成功匯入 ${appState.parsedUploadQueue.length} 筆規則並已同步至雲端！`);
  }
</script>
